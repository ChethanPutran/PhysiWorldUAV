headless: false

sim:
  dt: 0.01
  substeps: 1
  gravity: [0, 0, -9.81]
  replicate_physics: false
  use_flatcache: true
  use_gpu_pipeline: false
  device: "cpu"
  solver_type: 1
  use_gpu: false
  bounce_threshold_velocity: 0.2
  friction_offset_threshold: 0.04
  friction_correlation_distance: 0.025
  enable_stabilization: true
  gpu_max_rigid_contact_count: 524288
  gpu_max_rigid_patch_count: 163840
  gpu_found_lost_pairs_capacity: 4194304
  gpu_found_lost_aggregate_pairs_capacity: 33554432
  gpu_total_aggregate_pairs_capacity: 4194304
  gpu_max_soft_body_contacts: 1048576
  gpu_max_particle_contacts: 1048576
  gpu_heap_capacity: 67108864
  gpu_temp_buffer_capacity: 16777216
  gpu_max_num_partitions: 8

drone_model:
  name: "Hummingbird"
  controller: "RateController"

# ── Thrust tuning ────────────────────────────────────────
# Vertical acceleration command, in m/s²
thrust_accel_base: 9.81
thrust_accel_step: 2

keyboard:
  thrust_up: "W"       # change to "Q" if W/S conflict with viewport camera
  thrust_down: "S"     # change to "E" if W/S conflict with viewport camera
  roll_left: "A"
  roll_right: "D"
  pitch_forward: "I"
  pitch_backward: "K"
  yaw_left: "J"
  yaw_right: "L"
  reset: "R"

logging:
  enabled: true
  output_dir: "/datasets/manual_flights"

camera:
  enabled: true
  resolution: [640, 480]
  position: [0.2, 0.0, 0.1]

