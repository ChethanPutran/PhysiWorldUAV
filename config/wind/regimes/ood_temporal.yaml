# OOD temporal structure: fast oscillation (f > 0.5 Hz), sharp steps (rise < 0.2 s),
# fast OU (τ < 1 s); magnitude within ID limits.
name: ood_temporal
category: ood_temporal
mean_speed: [0.0, 2.5]
azimuth_deg: [0.0, 360.0]
elevation_deg: [-5.0, 5.0]
profiles:
  - {type: sinusoid, weight: 0.4, params: {amplitude_mps: [0.3, 0.8], frequency_hz: [0.6, 1.5]}}
  - {type: step, weight: 0.3, params: {delta_mps: [-1.2, 1.2], rise_time_s: [0.0, 0.15], onset_fraction: [0.2, 0.7]}}
  - {type: ou, weight: 0.3, params: {sigma_mps: [0.2, 0.5], tau_s: [0.2, 0.8]}}
limits: {peak_speed_max: 4.0, vertical_max: 1.0, mean_horizontal: [0.0, 4.0]}
