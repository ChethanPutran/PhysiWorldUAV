# Pilot v7 (2026-11-25, PLAN ONLY until approved): 20 Hz model step (physics=isaac_200hz_m20, control_decimation 10), 10 s = 200-step episodes,
# about 1M model steps in total. Wind: id_v7 (ID peak <= 6.2 m/s, mean 0-5.2, 5 stratified, upper-weighted bands) and ood_magnitude_v7 (mean > 6.2, peak <= 9,
# 3 bands). Parts as in the pilot, groups scaled about 34x (sizes below), 20-200 domains per part (about 470 vehicles).
# Plan:  generate plan experiment=pilot_v7 physics=isaac_200hz_m20
name: pilot_v7
dataset_id: physiworld_pilot_v7
dataset_version: 0.7.0
seed: 20261125
