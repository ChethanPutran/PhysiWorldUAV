# Option C verification: how many episodes stay inside the force-model applicability envelope (rotor drag mu <= 0.20, body drag
# airspeed <= 12 m/s) when the in-distribution wind goes up to 6 m/s and the OOD-magnitude wind to (6, 9] m/s?
# Real simulator, moving and hovering scenarios, randomised vehicles (force_scale, mass and drag scales change mu through the rotor speed).
# Not a dataset to train on: scratch output.
name: wind_envelope_check
dataset_id: physiworld_envcheck
dataset_version: 0.1.0
seed: 20261124
parts:
  - name: id_wide
    roles: {train: 1.0}
    n_groups: 14
    domain: randomized
    n_domains: 6
    wind_regime: id_wide
    forces: truth_default
    mix:
      - {scenario: hover,       weight: 0.15}
      - {scenario: translation, weight: 0.30, excitation: ref_smooth}
      - {scenario: accel_decel, weight: 0.30}
      - {scenario: circle,      weight: 0.15, excitation: multisine}
      - {scenario: line,        weight: 0.10}
  - name: ood_wide
    roles: {test_ood_magnitude: 1.0}
    n_groups: 26
    domain: randomized
    n_domains: 8
    wind_regime: ood_magnitude_wide
    forces: truth_default
    mix:
      - {scenario: hover,       weight: 0.2}
      - {scenario: translation, weight: 0.3}
      - {scenario: accel_decel, weight: 0.3}
      - {scenario: circle,      weight: 0.2}
