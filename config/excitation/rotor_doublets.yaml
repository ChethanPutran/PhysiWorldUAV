# Open loop at the actuator: torque doublets + collective step around hover trim.
# Units: collective [N], tau_* [N m]. Ideal edges (motor lag smooths them).
channels:
  collective: {type: step, amplitude: [-1.0, 1.0], start_s: [0.5, 1.5]}
  tau_x: {type: doublet, amplitude: [-0.02, 0.02], start_s: [0.3, 1.0], width_s: [0.1, 0.25]}
  tau_y: {type: doublet, amplitude: [-0.02, 0.02], start_s: [0.3, 1.0], width_s: [0.1, 0.25]}
  tau_z: {type: step, amplitude: [-0.005, 0.005], start_s: [0.5, 1.5]}
