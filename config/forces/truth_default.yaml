# Simulator ground-truth aerodynamics (decision D5). Equations: docs/models/aerodynamics.md
# STATUS: coefficients APPROVED by the user at Run 5 start (decision Q3, 2026-11-17).
# The episode runner refuses `validated: false` configs for dataset generation.
name: truth_default
validated: true
air_density: 1.225            # kg/m³, ISA sea level 15 °C
rotor_radius_m: 0.10          # Hummingbird propeller mesh (sim/stl_parts): ±0.1001 m

rotor_drag:                   # linear rotor-induced drag (blade flapping + induced drag)
  enabled: true
  # mass-normalised coefficient at nominal hover, d [1/s]: a_drag = −d v⊥.
  # Faessler et al. RA-L 2018 identified d_x ≈ 0.43, d_y ≈ 0.26 s⁻¹ (0.61 kg, 6" stiff props,
  # 2.8 m/s), range 0.25–0.55 during identification, d_z ≈ 0. Proposed: 0.30 s⁻¹ (mid-range,
  # isotropic by symmetry of the "+" frame). k_rd = d·m₀/ΣΩ_hover = 0.30·0.716/1813 rad/s.
  d_hover_per_s: 0.30

body_drag:                    # quadratic parasitic drag of frame/body/motors
  enabled: true
  cd: [1.1, 1.1, 1.3]         # per-axis C_D (x_B, y_B, z_B), approved: bluff body 1.0–1.2 (Hoerner 1965); z higher (flat-plate-like face seen from above/below)
  area_m2: [0.0070, 0.0076, 0.0180]   # projected areas ⟂ x_B, y_B, z_B from the base_link mesh (Run 4)
  cop_offset_B: [0.0, 0.0, 0.0]

ground_effect:                # Cheeseman–Bennett; negligible above ~0.5 m (factor < 1.003)
  enabled: false
  min_height_over_radius: 0.5

aero_torque:                  # ablation only (double counts the rotor-drag ω×r damping)
  enabled: false

applicability:
  rotor_drag: {max_advance_ratio: 0.20, min_rotor_speed_fraction: 0.2}
  body_drag: {max_airspeed_mps: 12.0}
max_violation_fraction: 0.05
