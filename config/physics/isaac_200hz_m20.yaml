# As isaac_200hz.yaml but with a 20 Hz controller and model step (control_decimation 10 -> 0.05 s), as AirDreamer (policy 20 Hz, physics 200 Hz)
# and SkyJEPA (20 Hz). Used by the v7 plan: `physics=isaac_200hz_m20`. Everything else is identical to isaac_200hz.
# Simulator settings (plan §1-V4, D4, D6; Run 4 IMU decision (a)).
dt: 0.005                    # s, PhysX step (200 Hz)
control_decimation: 10       # controller / model step = 10·dt = 0.05 s (20 Hz)
device: cuda:0               # GPU used for PhysX dynamics
# gpu_dynamics_cpu_readback: GPU dynamics + GPU broadphase, results read back to the
# CPU every step (Isaac IMUSensor needs the readback; verified in Run 4).
# "gpu" (no readback) makes IMUSensor report gravity-only frames — not allowed.
physics_pipeline: gpu_dynamics_cpu_readback
headless: true
gravity: 9.81                # m/s², must equal DroneParams.G
enhanced_determinism: true   # physxScene:enableEnhancedDeterminism (V4)
# The Isaac IMUSensor reports specific force minus ω_B × v_B (measured on the Run 5 pilot: R² 0.83, residual p99 1.81 -> 0.057 m/s² after
# correcting). true: the runner adds ω_B × v_B (ground truth of the same physics step) so the logged accelerometer is the specific force
# at the base link, as a real accelerometer measures. false reproduces the raw sensor (Run 5 pilot v0.5.0 behaviour).
imu_transport_correction: true
# Settle steps at trim before the exact initial condition is restored (runner). 1 = the Run 5 behaviour. More steps flush simulator
# state carried over from the previous episode (the same episode differed by <= 6e-6 m depending on what ran before it in the process).
settle_steps: 1
rigid_body_damping:          # D6: OmniDrones defaults are 0.2 / 0.2 (hidden drag)
  linear: 0.0
  angular: 0.0
solver:                      # OmniDrones RobotCfg values, recorded for provenance
  position_iterations: 4
  velocity_iterations: 0
