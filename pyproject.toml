[project]
name = "physiworld-uav"
version = "0.1.0"
description = "Physics-prior latent world models for reliable long-horizon UAV prediction under OOD wind disturbances"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
  { name = "Chethan" },
]

# Runtime dependencies available in the omnidrones_env venv. Isaac Sim (4.1) and
# OmniDrones (0.1.1, editable install) are provided by the container and are not
# pip-resolvable; see docs/guides/environment.md.
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "torch>=2.2",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "h5py>=3.8",
  "pandas>=2.0",
  "psutil>=5.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2"]

[project.scripts]
physiworld-generate = "physiworld_uav.experiments.generate:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
